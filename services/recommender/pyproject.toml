[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotuner-recommender"
version = "0.2.0"
description = "Evidence-backed SQL Server index recommendations and heuristic scoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["autotuner-collector>=0.1,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8"]

[project.scripts]
autotuner-recommender = "recommender.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
